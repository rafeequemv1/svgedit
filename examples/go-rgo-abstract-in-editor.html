<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SVGEdit — GO/rGO Graphical Abstract</title>
  <link rel="icon" href="../src/editor/images/logo.svg">
  <link href="../src/editor/svgedit.css" rel="stylesheet" media="all">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #container { width: 100%; height: 100vh; }
    #boot-banner {
      position: fixed; z-index: 99999; left: 12px; bottom: 12px;
      background: #0f172a; color: #e2e8f0; font: 12px/1.4 Segoe UI, sans-serif;
      padding: 8px 12px; border-radius: 8px; opacity: 0.92;
      pointer-events: none; transition: opacity .4s;
    }
    #boot-banner.hide { opacity: 0; }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="boot-banner">Loading GO/rGO graphical abstract…</div>
  <script type="module">
    import Editor from '../src/editor/Editor.js'

    const ABSTRACT_URL = './go-rgo-abstract.svg'
    const banner = document.getElementById('boot-banner')

    const svgEditor = new Editor(document.getElementById('container'))
    svgEditor.setConfig({
      allowInitialUserOverride: true,
      extensions: [],
      noDefaultExtensions: false,
      userExtensions: []
    })
    await svgEditor.init()
    window.svgEditor = svgEditor

    const dismissStorage = () => {
      const d = document.querySelector('se-storage-dialog')
      if (!d) return
      if (d.getAttribute('dialog') === 'open') {
        d.shadowRoot?.querySelector('#storage_ok')?.click()
        d.querySelector?.('#storage_ok')?.click()
        d.setAttribute('dialog', 'close')
      }
    }
    dismissStorage()
    setTimeout(dismissStorage, 300)
    setTimeout(dismissStorage, 1000)

    try {
      const res = await fetch(ABSTRACT_URL)
      if (!res.ok) throw new Error(`HTTP ${res.status}`)
      let xml = await res.text()
      xml = xml.replace(/<\?xml[^?]+\?>\s*/i, '').trim()

      const canvas = svgEditor.svgCanvas
      canvas.clear()
      const ok = canvas.setSvgString(xml) !== false
      if (!ok) throw new Error('setSvgString rejected SVG')
      try { canvas.setResolution(900, 900) } catch (_) {}
      svgEditor.updateCanvas?.(true)
      try { svgEditor.zoomChanged?.(window, 'canvas') } catch (_) {}
      banner.textContent = 'GO/rGO abstract loaded — Structure · Properties · Applications · Functionality'
    } catch (err) {
      console.error(err)
      banner.textContent = `Failed to load abstract: ${err.message || err}`
    }
    setTimeout(() => banner.classList.add('hide'), 3000)
  </script>
</body>
</html>
